# }

upstream app-yh {
  server app-yh:8011;
}

upstream app-js {
  server app-js:8012;
}

server {
  listen 80;
  
  # Serve shared assets volume
  location /assets/ {
    alias /usr/share/nginx/html/assets/;
    autoindex on;
    add_header Cache-Control "no-cache";
  }
  
  # ye: 이미지 생성/분석 (현재 실행 중이지 않음)
  # location /api/ye/ {
  #   proxy_pass http://app-ye/;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
  
  # yh: YOLO/Planner/Overlay/Eval/Judge
  location /api/yh/ {
    proxy_pass http://app-yh/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /api/yh;
  }
  
  # js: FE/BFF & 업로드/Job 제출
  location /api/js/ {
    proxy_pass http://app-js/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  # simple health
  location = /healthz { return 200 'OK'; add_header Content-Type text/plain; }
}
