upstream app-ye {
  server app-ye:8000;
}

upstream app-yh {
  server app-yh:8000;
}

upstream app-js {
  server app-js:8000;
}

upstream app-sh {
  server app-sh:8000;
}

server {
  listen 80;
  
  # Serve shared assets volume
  location /assets/ {
    alias /usr/share/nginx/html/assets/;
    autoindex on;
    add_header Cache-Control "no-cache";
  }
  
  # ye: 이미지 생성/분석
  location /api/ye/ {
    proxy_pass http://app-ye/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  # yh: YOLO/Planner/Overlay/Eval/Judge
  location /api/yh/ {
    proxy_pass http://app-yh/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  # js: FE/BFF & 업로드/Job 제출
  location /api/js/ {
    proxy_pass http://app-js/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  # sh: 이미지 향상/배경 제거
  location /api/sh/ {
    proxy_pass http://app-sh/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  # simple health
  location = /healthz { return 200 'OK'; add_header Content-Type text/plain; }
}
