# Prometheus 설정 파일
global:
  scrape_interval: 15s      # 15초마다 메트릭 수집
  evaluation_interval: 15s   # 15초마다 알림 규칙 평가
  external_labels:
    cluster: 'feedlyai'
    environment: 'development'

# 알림 규칙 파일
rule_files:
  - '/etc/prometheus/alerts.yml'

# 스크랩 설정
scrape_configs:
  # ---------- Prometheus 자체 메트릭 ----------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']  # 자기 자신이므로 localhost 사용 가능
        labels:
          instance: 'prometheus'

  # ---------- Node Exporter (시스템 메트릭) ----------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'feedlyai-host'

  # ---------- PostgreSQL Exporter (DB 메트릭) ----------
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          instance: 'postgres-exporter'

  # ---------- 애플리케이션 서비스 (FastAPI) ----------
  # 각 서비스는 /metrics 엔드포인트를 노출해야 함
  # 주의: localhost는 Prometheus 컨테이너 내부를 가리키므로 사용 불가
  # Docker 네트워크를 통해 컨테이너 이름으로 접근 (같은 네트워크에 있어야 함)
  - job_name: 'app-ye'
    static_configs:
      - targets: ['app-ye:8010']  # Docker 네트워크를 통해 접근 (포트는 컨테이너 내부 포트)
        labels:
          service: 'app-ye'
          part: 'ye'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'app-yh'
    static_configs:
      - targets: ['app-yh:8011']  # Docker 네트워크를 통해 접근 (포트는 컨테이너 내부 포트)
        labels:
          service: 'app-yh'
          part: 'yh'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'app-js'
    static_configs:
      - targets: ['app-js:8012']  # Docker 네트워크를 통해 접근 (포트는 컨테이너 내부 포트)
        labels:
          service: 'app-js'
          part: 'js'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'app-sh'
    static_configs:
      - targets: ['app-sh:8013']  # Docker 네트워크를 통해 접근 (포트는 컨테이너 내부 포트)
        labels:
          service: 'app-sh'
          part: 'sh'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ---------- Nginx Exporter (선택사항) ----------
  # Nginx에 stub_status 모듈이 활성화되어 있어야 함
  # - job_name: 'nginx-exporter'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']
  #       labels:
  #         instance: 'nginx'

